<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var arr = new Array(1,2,4,5,9,6);
        document.write(arr.join()+'<br>');
        arr.unshift(7);
        // thêm 3,8 vào mảng
        document.write(arr.join()+'<br>');
        arr.unshift(3,8);
        document.write(arr.join()+'<br>');
       
    </script>
</body>
</html>
