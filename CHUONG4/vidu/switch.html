<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var nam;
         var nam = parseFloat(prompt("nhập giá trị của biến nam: "))
        switch(nam)
        {
            case 1: document.write("học đại cương"); break;
            case 2: document.write("học cơ sơ ngành"); break;
            case 3: document.write("học chuyên ngành"); break;
            case 4: document.write("làm khoá luận"); break;
            default : document.write("ra trường");
        }
    </script>
</body>
</html>
