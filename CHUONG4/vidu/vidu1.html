<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xếp loại điểm</title>
</head>
<body>
    <script>
        var diem, xeploai;

        diem = Number(prompt("Nhập điểm:"));

        if (diem >= 8.5) {
            xeploai = "Giỏi";
        }
        else if (diem >= 7) {
            xeploai = "Khá";
        }
        else if (diem >= 5) {
            xeploai = "TB";
        }
        else {
            xeploai = "Yếu";
        }

        document.write("Điểm: " + diem + "<br>");
        document.write("Xếp loại: " + xeploai);
    </script>
</body>
</html>
